<div class="min-vh-100 d-flex justify-content-center align-items-center bg-light">
    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        <h2 class="text-center mb-4">Inicio de sesión</h2>
        
        <form (ngSubmit)="iniciarSesion()">
            
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" name="email" [(ngModel)]="correo" placeholder="name@example.com" required>
                <label for="email">Correo electrónico</label>
            </div>
            
            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="Password" name="password" [(ngModel)]="clave" placeholder="********" required>
                <label for="Password">Contraseña</label>
            </div>

            <div *ngIf="mensajeError" class="alert alert-danger py-2 text-center" role="alert">
                {{ mensajeError }}
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary btn-lg" [disabled]="cargando">
                    {{ cargando ? 'Verificando...' : 'Ingresar' }}
                </button>
            </div>
        </form>

        <div class="text-center d-flex flex-column gap-2">
            <a routerLink="/recuperar" class="text-center mt-3 text-decoration-none">Recuperar contraseña</a>
            <a routerLink="/register/form" class="text-decoration-none small">¿No tienes cuenta? Regístrate</a>
        </div>   
    </div>
</div>

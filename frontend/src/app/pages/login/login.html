<div class="min-vh-100 d-flex justify-content-center align-items-center bg-light">
    <div class="card shadow p-4">
        <h2 class="text-center mb-4">inicio de sesion</h2>
    <form>
        <div class="form-floating mb-3">
            <input type="email" class="form-control form-control-lg" id="email" placeholder="name@example.com">
            <label for="floatingInput">Correo electronico</label>
        </div>
        <div class="form-floating mb-4">
            <input type="password" class="form-control" id="Password" placeholder="********">
            <label for="floatingPassword">Contraseña</label>
        </div>
        <div class="d-grid mb-3">
            <button type="submit" class="btn btn-primary btn-lg">Ingresar</button>
        </div>
    </form>

        <div class="text-center d-flex flex-column gap-2">
            <a routerLink="/recuperar" class="text-center mt-3">recuperar contraseña</a>
            <a routerLink="/registro" class="text-decoration-none small">¿No tienes cuenta? Regístrate</a>
        </div>   
    </div>
</div>

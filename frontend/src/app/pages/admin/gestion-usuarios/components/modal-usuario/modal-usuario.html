<div class="modal-backdrop">

  <div class="modal-container">

    <!-- Header -->
    <div class="modal-header">
      <h5 class="mb-0">
        {{ modoEdicion ? 'Editar Usuario' : 'Crear Usuario' }}
      </h5>
      <button type="button" class="btn-close" (click)="cerrarModal()"></button>
    </div>

    <!-- Body -->
    <div class="modal-body">

      <div class="modal-form-grid">

        <div class="mb-3">
          <label class="form-label">Nombre(s)</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="usuario.first_name">
        </div>

        <div class="mb-3">
          <label class="form-label">Apellidos</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="usuario.last_name">
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            [(ngModel)]="usuario.email">
        </div>

        <div class="mb-3">
          <label class="form-label">Telefono</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="usuario.phone">
        </div>

        <div class="mb-3">
          <label class="form-label">Rol (ID)</label>
          <input
            type="number"
            class="form-control"
            [(ngModel)]="usuario.role_id">
        </div>

        <div class="mb-3">
          <label class="form-label">Tipo de documento (ID)</label>
          <input
            type="number"
            class="form-control"
            [(ngModel)]="usuario.document_type_id">
        </div>

        <div class="mb-3">
          <label class="form-label">Numero de documento</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="usuario.document_number">
        </div>

        <div class="mb-3">
          <label class="form-label">Genero</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="usuario.gender">
        </div>

        <div class="mb-3 modal-full-width">
          <label class="form-label">Contrasena</label>
          <input
            type="password"
            class="form-control"
            [(ngModel)]="usuario.password">
        </div>

        <div class="mb-3 modal-full-width">
          <label class="form-label">Estado</label>
          <select
            class="form-select"
            [(ngModel)]="usuario.status">
            <option value="ACTIVE">Activo</option>
            <option value="INACTIVE">Inactivo</option>
          </select>
        </div>

      </div>

    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="cerrarModal()">
        Cancelar
      </button>
      <button class="btn btn-primary" (click)="guardarUsuario()">
        {{ modoEdicion ? 'Actualizar' : 'Guardar' }}
      </button>

    </div>

  </div>

</div>

<div class="min-vh-100 d-flex justify-content-center align-items-center bg-light">
    <div class="card shadow p-4 register-card">
        <h2 class="text-center mb-4">Registro</h2>
    <form class="register-form">
        <div class="form-floating mb-3">
            <input type="text" class="form-control form-control-lg" id="name" placeholder=" ">
            <label for="name">Nombre(s)</label>
        </div>

        <div class="form-floating mb-4">
            <input type="text" class="form-control form-control-lg" id="apellido" placeholder=" ">
            <label for="apellido">Apellido(s)</label>
        </div>


        <div class="form-floating mb-3">
            <select class="form-select form-select-lg" id="tipo-documento" aria-label="Tipo de documento">
                <option value="" selected>Selecciona una opcion</option>
                <option value="cc">C.C</option>
                <option value="ti">T.I</option>
                <option value="pasaporte">Pasaporte</option>
            </select>
            <label for="tipo-documento">Tipo de documento</label>
        </div>

        <div class="form-floating mb-3">
            <input 
            type="tel" 
            class="form-control form-control-lg" 
            id="numero-documento" 
            placeholder=" " 
            (keypress)="validarSoloNumeros($event)" >
            <label for="numero-documento">Numero de documento</label>
        </div>


        <div class="form-floating mb-3">
            <input type="email" class="form-control form-control-lg" id="email" placeholder=" ">
            <label for="email">Correo electronico</label>
        </div>


        <div class="form-floating mb-4">
            <input type="password" class="form-control form-control-lg" id="password" placeholder=" ">
            <label for="password">Contraseña</label>
        </div>


        <div class="form-floating mb-4">
            <input type="password" class="form-control form-control-lg" id="confirm-password" placeholder=" ">
            <label for="confirm-password">Confirma tu contraseña</label>
        </div>


        <div class="d-grid mb-3">
            <button type="submit" class="btn btn-primary btn-lg">Registrar</button>
        </div>
    </form>

        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="exampleCheck1">
            <label class="form-check-label" for="exampleCheck1"></label>
            <a routerLink="/register/termsConditions" class="text-center mt-3">Leer y aceptar terminos y condiciones</a>
        </div>  
    </div>
</div>

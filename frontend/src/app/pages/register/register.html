<div class="auth-container">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="auth-icon">
        <i class="bi bi-person-plus-fill"></i>
      </div>
      <h2 class="mt-3">Crear Cuenta</h2>
      <p class="text-muted">Comienza tu transformación</p>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">Nombre completo</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="nombre"
          name="nombre"
          placeholder="Juan Pérez"
          required>
      </div>

      <div class="mb-3">
        <label class="form-label">Correo electrónico</label>
        <input
          type="email"
          class="form-control"
          [(ngModel)]="email"
          name="email"
          placeholder="tu@correo.com"
          required>
      </div>

      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input
          type="password"
          class="form-control"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          required>
      </div>

      <div class="mb-4">
        <label class="form-label">Confirmar contraseña</label>
        <input
          type="password"
          class="form-control"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="••••••••"
          required>
      </div>

      <button type="submit" class="btn btn-success w-100 mb-3">
        Crear Cuenta
      </button>

      <div class="text-center">
        <p class="text-muted mb-0">
          ¿Ya tienes cuenta?
          <a routerLink="/login" class="text-success fw-semibold">Iniciar Sesión</a>
        </p>
      </div>
    </form>
  </div>
</div>
